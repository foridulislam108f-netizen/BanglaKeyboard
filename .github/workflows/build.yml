name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find project folder
        id: proj
        run: |
          echo "--- repo files ---"
          find . -not -path './.git/*' -not -path './.git' | head -100
          # settings.gradle(.kts) যত গভীরেই থাকুক, খুঁজে বের করবে (সবচেয়ে ছোট পাথটা নেবে)
          F=$(find . -not -path './.git/*' -type f \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) | awk '{print length($0) " " $0}' | sort -n | head -1 | cut -d' ' -f2-)
          if [ -z "$F" ]; then
            echo "::error::settings.gradle.kts পাওয়া যায়নি। রিপোতে প্রজেক্টের ফাইলগুলো (settings.gradle.kts, app/ ফোল্ডার ইত্যাদি) ঠিকমতো আপলোড হয়েছে কিনা দেখুন।"
            exit 1
          fi
          DIR=$(dirname "$F")
          echo "Project dir: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BanglaKeyboard-APK
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release (for in-app update notice)
        working-directory: ${{ steps.proj.outputs.dir }}
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/debug/app-debug.apk BanglaBoard.apk
          gh release delete "v$VER" --yes --cleanup-tag 2>/dev/null || true
          gh release create "v$VER" BanglaBoard.apk \
            --title "Bangla Board $VER" \
            --notes "${NOTES:-New version}" --latest
