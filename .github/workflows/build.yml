name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find project folder
        id: proj
        run: |
          if [ ! -f settings.gradle.kts ] && [ ! -f settings.gradle ]; then
            z=$(find . -maxdepth 2 -name '*.zip' -not -path './.git/*' | head -n 1)
            if [ -n "$z" ]; then
              echo "Unzipping $z"
              mkdir -p _src
              unzip -q -o "$z" -d _src
            fi
          fi
          if [ -f settings.gradle.kts ] || [ -f settings.gradle ]; then
            dir="."
          else
            f=$(find . -maxdepth 4 \( -name settings.gradle.kts -o -name settings.gradle \) -not -path './.git/*' | head -n 1)
            if [ -z "$f" ]; then
              echo "No settings.gradle(.kts) found"
              ls -R | head -50
              exit 1
            fi
            dir=$(dirname "$f")
          fi
          echo "Project folder: $dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BanglaKeyboard-APK
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
