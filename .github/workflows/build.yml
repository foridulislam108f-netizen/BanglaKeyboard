name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project if uploaded as zip
        run: |
          if ! find . -not -path './.git/*' -type f \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) | grep -q .; then
            Z=$(find . -not -path './.git/*' -type f -name '*.zip' | head -1)
            if [ -n "$Z" ]; then
              echo "Unzipping $Z"
              mkdir -p _unzipped
              unzip -q -o "$Z" -d _unzipped
            fi
          fi

      - name: Find project folder
        id: proj
        run: |
          find . -not -path './.git/*' -not -path './.git' | head -100
          F=$(find . -not -path './.git/*' -type f \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) | awk '{print length($0) " " $0}' | sort -n | head -1 | cut -d' ' -f2-)
          if [ -z "$F" ]; then
            echo "::error::settings.gradle.kts পাওয়া যায়নি।"
            exit 1
          fi
          DIR=$(dirname "$F")
          echo "Project dir: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Add Maven Central mirror (fix 429 Too Many Requests)
        run: |
          GH="${GRADLE_USER_HOME:-$HOME/.gradle}"
          mkdir -p "$GH/init.d"
          cat > "$GH/init.d/mirror.gradle" <<'EOF'
          gradle.beforeSettings { settings ->
            settings.pluginManagement {
              repositories {
                maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2/") }
              }
            }
            settings.dependencyResolutionManagement {
              repositories {
                maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2/") }
              }
            }
          }
          EOF
          echo "Init script written to $GH/init.d/mirror.gradle"

      - name: Build debug APK
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          for i in 1 2 3; do
            echo "=== Build attempt $i ==="
            if gradle assembleDebug --no-daemon --stacktrace; then
              exit 0
            fi
            echo "Build failed, waiting before retry..."
            sleep 20
          done
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BanglaKeyboard-APK
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release (for in-app update notice)
        working-directory: ${{ steps.proj.outputs.dir }}
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/debug/app-debug.apk BanglaBoard.apk
          gh release delete "v$VER" --yes --cleanup-tag 2>/dev/null || true
          gh release create "v$VER" BanglaBoard.apk \
            --title "Bangla Board $VER" \
            --notes "${NOTES:-New version}" --latest
